[project]
name = "diagnose-agent"
version = "0.1.0"
description = "业务问题排查 Agent：代码检索 + 只读库核对 + 结论输出"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "langgraph>=0.2.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "openai>=2.26.0,<3.0.0",
    "pymilvus>=3.0.0,<4.0.0",
    "setuptools>=77.0.3,<81",
    "tree-sitter>=0.23.0,<0.27.0",
    "tree-sitter-java>=0.23.0,<0.30.0",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0,<9.0.0"]

[tool.pytest.ini_options]
# 在仓库根目录执行: pytest -c app/pyproject.toml -q
testpaths = ["../tests"]
pythonpath = [".."]
