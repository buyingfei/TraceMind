# 本地基础设施（可选）。
# 若你已用官方/自建 compose 启动 milvus-standalone+etcd+minio，可忽略本文件，
# 只需在 .env 配置 DIAGNOSE_MILVUS_URI=http://127.0.0.1:19530

services:
  postgres:
    image: postgres:16-alpine
    container_name: diagnose-agent-postgres
    environment:
      POSTGRES_USER: diagnose
      POSTGRES_PASSWORD: diagnose
      POSTGRES_DB: diagnose_agent
    ports:
      - "5432:5432"
    volumes:
      - diagnose_pg_data:/var/lib/postgresql/data
    profiles: ["full"]

volumes:
  diagnose_pg_data:
